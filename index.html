<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DLP Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="ai-core.js"></script>
    <!-- DOCX Template Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.42.0/docxtemplater.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip-utils.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0 !important; margin: 0 !important; }
            .max-w-4xl { max-width: 100% !important; width: 100% !important; margin: 0 !important; }
            .content-area { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            #outputContainer { padding: 0 !important; margin: 0 !important; }
            @page { size: A4; margin: 15mm; }
            
            /* Smart Print Adjustments */
            .lesson-sheet { border: none !important; box-shadow: none !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
            .lesson-sheet table { width: 100% !important; }
            tr, .lesson-segment, .section-header { break-inside: avoid; page-break-inside: avoid; }
            
            /* Ensure images load and are sized correctly in print */
            img { max-width: 80px !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        /* Style for the generated DLP table to match the screenshots */
        .dlp-table th { background-color: #f3f4f6; text-align: left; padding: 12px; border: 1px solid #d1d5db; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; tracking: 0.05em; }
        .dlp-table td { padding: 12px; border: 1px solid #d1d5db; vertical-align: top; }
        .section-header { background-color: #374151; color: white; padding: 8px 12px; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
        
        /* Editable area indicator */
        .field-editable:hover { background-color: #f0f7ff; cursor: text; transition: background 0.2s; }
        .field-editable::selection { background-color: #bfdbfe; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Input Section -->
        <div class="bg-white p-6 rounded-lg shadow-md no-print">
            <h1 class="text-2xl font-bold mb-4 text-blue-600">AI Detailed Lesson Plan Maker</h1>

            <div class="grid grid-cols-1 gap-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="apiKey" class="block text-sm font-medium text-gray-700">Gemini API Key</label>
                        <input type="password" id="apiKey" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your API Key">
                    </div>
                    <div>
                        <label for="modelSelect" class="block text-sm font-medium text-gray-700">AI Model</label>
                        <select id="modelSelect" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="gemini-3.1-flash-lite" selected>Gemini 3.1 Flash-Lite (Speed/Lite)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deep Detail)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                        <input type="text" id="subject" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., Introduction to Philosophy">
                    </div>
                    <div>
                        <label for="gradeLevel" class="block text-sm font-medium text-gray-700">Grade Level</label>
                        <input type="text" id="gradeLevel" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., 12">
                    </div>
                    <div>
                        <label for="numDays" class="block text-sm font-medium text-gray-700">Number of Days</label>
                        <select id="numDays" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="1">1 Day</option>
                            <option value="2">2 Days</option>
                            <option value="3">3 Days</option>
                            <option value="4" selected>4 Days</option>
                            <option value="5">5 Days</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="contentStandard" class="block text-sm font-medium text-gray-700">Content Standard</label>
                    <textarea id="contentStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="performanceStandard" class="block text-sm font-medium text-gray-700">Performance Standard</label>
                    <textarea id="performanceStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="competency" class="block text-sm font-medium text-gray-700">Learning Competencies (with codes)</label>
                    <textarea id="competency" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="Paste one or more competencies here...&#10;e.g.,&#10;1. PPT11/12-Ib-1.2...&#10;2. PPT11/12-Ic-2.1..."></textarea>
                </div>

                <div>
                    <label for="userSuggestions" class="block text-sm font-medium text-gray-700">Specific Details or Suggested Activities (Optional)</label>
                    <textarea id="userSuggestions" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., 'Include a debate about AI', 'Focus on local examples from our province', or 'I want a role-play activity on day 2'"></textarea>
                </div>

                <button onclick="generateDLP()" id="generateBtn" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                    Generate DLP
                </button>
            </div>
        </div>

        <!-- Floating Refinement UI -->
        <div id="refinePopup" class="fixed z-50 bg-white shadow-2xl rounded-xl border border-blue-200 p-4 hidden w-80 no-print">
            <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2">Refine this segment</p>
            <textarea id="refinePrompt" class="w-full text-xs p-2 border border-gray-200 rounded mb-2 outline-none focus:ring-2 ring-blue-500" rows="3" placeholder="e.g., 'Make this activity more group-oriented' or 'Simplify the language'"></textarea>
            <div class="flex justify-between items-center">
                <button onclick="hideRefine()" class="text-[10px] font-bold text-gray-400 hover:text-gray-600">CANCEL</button>
                <button id="refineBtn" onclick="applyRefinement()" class="bg-blue-600 text-white text-[10px] font-bold px-3 py-1.5 rounded hover:bg-blue-700 transition">APPLY CHANGES</button>
            </div>
        </div>

        <!-- History Section -->
        <div id="historyContainer" class="bg-white p-6 rounded-lg shadow-md no-print hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">Recent Lesson Plans</h2>
                <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">Clear All</button>
            </div>
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto pr-2">
                <!-- History items will be injected here -->
            </div>
        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="hidden bg-white p-8 rounded-lg shadow-md content-area relative">
            <div class="flex justify-between items-center mb-6 no-print">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold">Generated Lesson Plan</h2>
                    <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">PRO-TIP: Highlight text to refine it with AI</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="downloadDoc()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Download for Word (.doc)</button>
                    <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Print / Save PDF</button>
                </div>
            </div>

            <div id="dlpContent" class="text-sm leading-relaxed text-gray-800">
                <!-- Content will be injected here -->
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center p-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 font-medium loading-dots">AI is crafting your lesson plan</p>
        </div>
    </div>

    <script>
        let currentParsedData = null;
        let lastSelectedField = null;
        let currentHistoryId = null;
        let history = JSON.parse(localStorage.getItem('dlp_history') || '[]');

        // Sync manual edits back to data object and persistence
        document.getElementById('dlpContent').addEventListener('input', function(e) {
            const field = e.target.getAttribute('data-field');
            if (field && currentParsedData && currentHistoryId) {
                const newValue = e.target.innerHTML;
                
                // Update local data object
                if (field.startsWith('day_')) {
                    const index = parseInt(field.split('_')[1]);
                    currentParsedData.days[index].content = newValue;
                } else if (field.startsWith('objectives_')) {
                    const type = field.split('_')[1];
                    currentParsedData.objectives[type] = newValue;
                } else {
                    currentParsedData[field] = newValue;
                }

                // Update the actual item in history
                const item = history.find(h => h.id === currentHistoryId);
                if (item) {
                    item.data = currentParsedData;
                    // Also update top-level fields for history list/restore
                    if (field === 'subject') item.subject = e.target.innerText;
                    if (field === 'gradeLevel') item.gradeLevel = e.target.innerText;
                    if (field === 'teacherName') item.teacherName = e.target.innerText;

                    localStorage.setItem('dlp_history', JSON.stringify(history));
                    localStorage.setItem('last_dlp_id', currentHistoryId); // Remember this one
                    renderHistoryList();
                }
            }
        });

        function saveToHistory(data, inputs) {
            const newItem = {
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                subject: inputs.subject,
                gradeLevel: inputs.gradeLevel,
                teacherName: "Jhunrie G. Bayog", // Default
                contentStandard: inputs.contentStandard,
                performanceStandard: inputs.performanceStandard,
                competency: inputs.competency,
                userSuggestions: inputs.userSuggestions,
                data: data
            };
            currentHistoryId = newItem.id;
            history.unshift(newItem);
            if (history.length > 15) history.pop();
            localStorage.setItem('dlp_history', JSON.stringify(history));
            localStorage.setItem('last_dlp_id', newItem.id); // Save as last active
            renderHistoryList();
        }

        function renderHistoryList() {
            const container = document.getElementById('historyContainer');
            const list = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            list.innerHTML = history.map(item => `
                <div onclick="loadFromHistory(${item.id})" class="cursor-pointer border ${item.id === currentHistoryId ? 'border-blue-500 bg-blue-50' : 'border-gray-200'} p-3 rounded hover:bg-blue-50 transition flex justify-between items-center group">
                    <div>
                        <p class="font-bold text-sm text-blue-600">${item.subject || 'Untitled'}</p>
                        <p class="text-[10px] text-gray-500">${item.timestamp} • Grade ${item.gradeLevel}</p>
                    </div>
                    <button onclick="deleteHistoryItem(event, ${item.id})" class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            `).join('');
        }

        function loadFromHistory(id) {
            const item = history.find(h => h.id === id);
            if (!item) return;

            currentParsedData = item.data;
            currentHistoryId = id;
            
            // Restore inputs
            document.getElementById('subject').value = item.subject;
            document.getElementById('gradeLevel').value = item.gradeLevel;
            document.getElementById('contentStandard').value = item.contentStandard || '';
            document.getElementById('performanceStandard').value = item.performanceStandard || '';
            document.getElementById('competency').value = item.competency;
            document.getElementById('userSuggestions').value = item.userSuggestions || '';

            // Render Output
            document.getElementById('dlpContent').innerHTML = renderTemplate(
                currentParsedData, item.subject, item.gradeLevel,
                item.contentStandard || '', item.performanceStandard || '', item.competency,
                item.teacherName || "Jhunrie G. Bayog"
            );
            
            document.getElementById('outputContainer').classList.remove('hidden');
            document.getElementById('outputContainer').scrollIntoView({ behavior: 'smooth' });
            localStorage.setItem('last_dlp_id', id); // Remember this is now the active one
            renderHistoryList(); // Update highlight
        }

        function deleteHistoryItem(e, id) {
            e.stopPropagation();
            history = history.filter(h => h.id !== id);
            localStorage.setItem('dlp_history', JSON.stringify(history));
            renderHistoryList();
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all history?')) {
                history = [];
                localStorage.setItem('dlp_history', JSON.stringify(history));
                renderHistoryList();
            }
        }

        // Selection Listener for Refinement
        document.addEventListener('mouseup', function(e) {
            const selection = window.getSelection();
            const text = selection.toString().trim();
            
            if (text && text.length > 3) {
                // Find if the selection is inside a field-editable element
                let target = selection.anchorNode;
                if (target.nodeType === 3) target = target.parentElement;
                
                const editableParent = target.closest('.field-editable');

                if (editableParent) {
                    lastSelectedField = editableParent.getAttribute('data-field');
                    const popup = document.getElementById('refinePopup');
                    
                    // Position popup near the mouse cursor using clientX/Y (viewport relative)
                    // since the popup is "fixed"
                    const x = Math.min(e.clientX, window.innerWidth - 350);
                    const y = Math.min(e.clientY + 20, window.innerHeight - 200);
                    
                    popup.style.left = `${x}px`;
                    popup.style.top = `${y}px`;
                    popup.classList.remove('hidden');
                }
            } else {
                if (!e.target.closest('#refinePopup')) {
                    hideRefine();
                }
            }
        });

        function hideRefine() {
            document.getElementById('refinePopup').classList.add('hidden');
            document.getElementById('refinePrompt').value = '';
        }

        async function applyRefinement() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptText = document.getElementById('refinePrompt').value.trim();
            const btn = document.getElementById('refineBtn');
            const selectedModel = document.getElementById('modelSelect').value;
            
            if (!promptText || !lastSelectedField || !currentParsedData) return;

            btn.disabled = true;
            btn.innerText = "REFINING...";

            const subject = document.getElementById('subject').value;
            let context = '';
            if (lastSelectedField.startsWith('day_')) {
                const index = parseInt(lastSelectedField.split('_')[1]);
                context = currentParsedData.days[index].content;
            } else {
                context = currentParsedData[lastSelectedField];
            }

            try {
                const newContent = await callRefineSegment({
                    apiKey, subject, promptText, context, selectedModel
                });

                if (newContent) {
                    if (lastSelectedField.startsWith('day_')) {
                        const index = parseInt(lastSelectedField.split('_')[1]);
                        currentParsedData.days[index].content = newContent;
                    } else {
                        currentParsedData[lastSelectedField] = newContent;
                    }

                    // Update history and save
                    const historyItem = history.find(h => h.id === currentHistoryId);
                    if (historyItem) {
                        historyItem.data = currentParsedData;
                        localStorage.setItem('dlp_history', JSON.stringify(history));
                    }
                    
                    document.getElementById('dlpContent').innerHTML = renderTemplate(
                        currentParsedData, subject, 
                        document.getElementById('gradeLevel').value,
                        document.getElementById('contentStandard').value,
                        document.getElementById('performanceStandard').value,
                        document.getElementById('competency').value,
                        historyItem ? historyItem.teacherName : "Jhunrie G. Bayog"
                    );
                    hideRefine();
                }
            } catch (e) {
                alert('Refinement Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "APPLY CHANGES";
            }
        }

        async function downloadDoc() {
            if (!currentParsedData) {
                alert("Please generate a lesson plan first.");
                return;
            }

            const content = document.getElementById('dlpContent').innerHTML;
            
            // Captures all CSS styles from the page to ensure the Word doc looks the same
            let styles = "";
            for (const sheet of document.styleSheets) {
                try {
                    for (const rule of sheet.cssRules) {
                        styles += rule.cssText;
                    }
                } catch (e) { }
            }

            const header = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'>
                <style>
                    ${styles}
                    body { font-family: "Bookman Old Style", serif; font-size: 11pt; }
                    .lesson-sheet { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; }
                    .field-editable:hover { background-color: transparent !important; }
                    table { border-collapse: collapse; width: 100%; }
                    td, th { border: 1px solid black; padding: 5px; }
                </style>
                </head><body>`;
            
            const footer = "</body></html>";
            const sourceHTML = header + content + footer;

            const out = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
            const url = URL.createObjectURL(out);
            const link = document.createElement("a");
            link.href = url;
            link.download = `LessonPlan_${document.getElementById('subject').value.replace(/\s+/g, '_')}.doc`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function fallbackDownloadDoc() {
            const content = document.getElementById('dlpContent').innerHTML;
            const header = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Lesson Plan</title>
                <style>
                    body { font-family: "Bookman Old Style", serif; font-size: 11pt; }
                    table { border-collapse: collapse; width: 100%; }
                    td, th { border: 1px solid black; padding: 5px; vertical-align: top; }
                    .section-header { background-color: #BFBFBF; font-weight: bold; text-align: center; }
                    .dashed-border { border-right: 1px dashed black !important; }
                    ul { margin-left: 20px; }
                </style>
                </head><body>`;
            const footer = "</body></html>";
            const sourceHTML = header + content + footer;

            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'LessonPlan_Fallback.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }

        // Load saved values on startup
        window.onload = function() {
            renderHistoryList();
            const fields = ['apiKey', 'subject', 'gradeLevel', 'contentStandard', 'performanceStandard', 'competency', 'userSuggestions', 'modelSelect', 'numDays'];

            fields.forEach(field => {
                const savedValue = localStorage.getItem(field);
                if (savedValue) {
                    const el = document.getElementById(field);
                    if (el) el.value = savedValue;
                }
                
                const el = document.getElementById(field);
                if (el) {
                    el.addEventListener('input', (e) => localStorage.setItem(field, e.target.value));
                    el.addEventListener('change', (e) => localStorage.setItem(field, e.target.value));
                }
            });

            // Auto-load last active DLL
            const lastId = localStorage.getItem('last_dlp_id');
            if (lastId) {
                loadFromHistory(parseInt(lastId));
            }
        };

        function renderTemplate(data, subject, gradeLevel, contentStandard, performanceStandard, competency, teacherName = "Jhunrie G. Bayog") {
            const formattedCompetency = competency.split('\n').map(c => `<li>${c.trim()}</li>`).join('');
            
            let daysHtml = '';
            data.days.forEach((day, index) => {
                daysHtml += `
                    <div class="mb-6 lesson-segment">
                        <p class="font-bold underline text-[11px] mb-2 uppercase tracking-tight font-sans">DAY ${index + 1}: ${day.title}</p>
                        <div contenteditable="true" class="text-justify field-editable leading-relaxed outline-none" data-field="day_${index}">${day.content}</div>
                    </div>
                `;
            });

            return `
                <div class="p-8 bg-white shadow-lg max-w-[210mm] mx-auto text-[11pt] leading-tight font-serif text-black min-h-[297mm] lesson-sheet border-2 border-gray-800">
                    <!-- Header Section -->
                    <table class="w-full mb-1 font-sans border-none" style="border: none !important; width: 100%; border-collapse: collapse; table-layout: fixed;">
                        <tr style="border: none !important;">
                            <td style="width: 90px; border: none !important; vertical-align: middle; padding: 0;">
                                <img src="./assets/dll_jgb_itphp_lc2_files/image003.gif" style="width: 80px; height: 80px; display: block;" alt="Logo 1">
                            </td>
                            <td class="text-center" style="border: none !important; vertical-align: middle; padding: 0;">
                                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                                    <p style="font-size: 14px; font-weight: 300; line-height: 1; margin: 0;">|</p>
                                    <p style="font-weight: 700; font-size: 14px; letter-spacing: 0.05em; margin: 0; text-transform: uppercase;">SCHOOLS DIVISION OF ALBAY</p>
                                    <p style="font-weight: 900; font-size: 18px; letter-spacing: -0.025em; margin: 0; text-transform: uppercase; white-space: nowrap;">San Antonio National High School</p>
                                </div>
                            </td>
                            <td style="width: 90px; border: none !important; text-align: right; vertical-align: middle; padding: 0;">
                                <img src="./assets/dll_jgb_itphp_lc2_files/image004.gif" style="width: 80px; height: 80px; display: block; margin-left: auto;" alt="Logo 2">
                            </td>
                        </tr>
                    </table>
                    <hr class="border-t border-black mb-4">

                    <div class="text-center mb-6 font-sans">
                        <p class="font-black text-base uppercase leading-tight">LESSON PLAN IN ${subject.toUpperCase()} ${gradeLevel}</p>
                        <p class="font-bold text-sm">Term 1 (SY: 2026-2027)</p>
                    </div>

                    <table class="w-full border-collapse border border-black mb-6 font-sans text-xs">
                        <tr class="border-b border-black">
                            <td class="p-2 font-bold w-[30%] border-r border-dashed border-black">Lesson Title</td>
                            <td class="p-2 uppercase font-medium outline-none" contenteditable="true" data-field="subject">${subject}</td>
                        </tr>
                        <tr class="border-b border-black">
                            <td class="p-2 font-bold border-r border-dashed border-black">Learning Area/s</td>
                            <td class="p-2 outline-none" contenteditable="true" data-field="learningArea">${subject}</td>
                        </tr>
                        <tr class="border-b border-black">
                            <td class="p-2 font-bold border-r border-dashed border-black">Name of Teacher/s</td>
                            <td class="p-2 outline-none" contenteditable="true" data-field="teacherName">${teacherName}</td>
                        </tr>
                        <tr class="border-b border-black">
                            <td class="p-2 font-bold border-r border-dashed border-black">Grade Level and Section</td>
                            <td class="p-2 outline-none" contenteditable="true" data-field="gradeLevel">${gradeLevel}</td>
                        </tr>
                        <tr class="border-b border-black">

        async function generateDLP() {
            const inputs = {
                apiKey: document.getElementById('apiKey').value.trim(),
                subject: document.getElementById('subject').value.trim(),
                gradeLevel: document.getElementById('gradeLevel').value.trim(),
                numDays: document.getElementById('numDays').value,
                contentStandard: document.getElementById('contentStandard').value.trim(),
                performanceStandard: document.getElementById('performanceStandard').value.trim(),
                competency: document.getElementById('competency').value.trim(),
                userSuggestions: document.getElementById('userSuggestions').value.trim(),
                selectedModel: document.getElementById('modelSelect').value
            };

            if (!inputs.apiKey) { alert('Please enter an API Key'); return; }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const output = document.getElementById('outputContainer');

            btn.disabled = true;
            loading.classList.remove('hidden');
            output.classList.add('hidden');

            try {
                const result = await callGenerateDLP(inputs);
                const cleanJsonStr = result.text.replace(/^```json\n?|```$/gm, '').trim();
                currentParsedData = JSON.parse(cleanJsonStr);
                
                saveToHistory(currentParsedData, inputs);

                document.getElementById('dlpContent').innerHTML = renderTemplate(
                    currentParsedData, inputs.subject, inputs.gradeLevel, 
                    inputs.contentStandard, inputs.performanceStandard, inputs.competency
                );
                
                output.classList.remove('hidden');
            } catch (error) {
                alert('API Error: ' + error.message);
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }
    </script>
