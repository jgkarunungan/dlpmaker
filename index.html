<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DLP Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="ai-core.js"></script>
    <!-- DOCX Template Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.42.0/docxtemplater.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip-utils.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0 !important; margin: 0 !important; }
            .max-w-4xl { max-width: 100% !important; width: 100% !important; margin: 0 !important; }
            .content-area { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            #outputContainer { padding: 0 !important; margin: 0 !important; }
            @page { size: A4; margin: 15mm; }
            
            /* Smart Print Adjustments */
            .lesson-sheet { border: none !important; box-shadow: none !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
            .lesson-sheet table { width: 100% !important; }
            tr, .lesson-segment, .section-header { break-inside: avoid; page-break-inside: avoid; }
            
            /* Ensure images load and are sized correctly in print */
            img { max-width: 80px !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        /* Style for the generated DLP table to match the screenshots */
        .dlp-table th { background-color: #f3f4f6; text-align: left; padding: 12px; border: 1px solid #d1d5db; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; tracking: 0.05em; }
        .dlp-table td { padding: 12px; border: 1px solid #d1d5db; vertical-align: top; }
        .section-header { background-color: #374151; color: white; padding: 8px 12px; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
        
        /* Editable area indicator */
        .field-editable:hover { background-color: #f0f7ff; cursor: text; transition: background 0.2s; }
        .field-editable::selection { background-color: #bfdbfe; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Input Section -->
        <div class="bg-white p-6 rounded-lg shadow-md no-print">
            <h1 class="text-2xl font-bold mb-4 text-blue-600">AI Detailed Lesson Plan Maker</h1>

            <div class="grid grid-cols-1 gap-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="apiKey" class="block text-sm font-medium text-gray-700">Gemini API Key</label>
                        <input type="password" id="apiKey" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your API Key">
                    </div>
                    <div>
                        <label for="modelSelect" class="block text-sm font-medium text-gray-700">AI Model</label>
                        <select id="modelSelect" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="gemini-3.1-flash-lite" selected>Gemini 3.1 Flash-Lite (Speed/Lite)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deep Detail)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                        <input type="text" id="subject" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., Introduction to Philosophy">
                    </div>
                    <div>
                        <label for="gradeLevel" class="block text-sm font-medium text-gray-700">Grade Level</label>
                        <input type="text" id="gradeLevel" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., 12">
                    </div>
                    <div>
                        <label for="numDays" class="block text-sm font-medium text-gray-700">Number of Days</label>
                        <select id="numDays" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="1">1 Day</option>
                            <option value="2">2 Days</option>
                            <option value="3">3 Days</option>
                            <option value="4" selected>4 Days</option>
                            <option value="5">5 Days</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="contentStandard" class="block text-sm font-medium text-gray-700">Content Standard</label>
                    <textarea id="contentStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="performanceStandard" class="block text-sm font-medium text-gray-700">Performance Standard</label>
                    <textarea id="performanceStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="competency" class="block text-sm font-medium text-gray-700">Learning Competencies (with codes)</label>
                    <textarea id="competency" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="Paste one or more competencies here...&#10;e.g.,&#10;1. PPT11/12-Ib-1.2...&#10;2. PPT11/12-Ic-2.1..."></textarea>
                </div>

                <div>
                    <label for="userSuggestions" class="block text-sm font-medium text-gray-700">Specific Details or Suggested Activities (Optional)</label>
                    <textarea id="userSuggestions" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., 'Include a debate about AI', 'Focus on local examples from our province', or 'I want a role-play activity on day 2'"></textarea>
                </div>

                <div class="flex gap-2">
                    <button onclick="generateDLP()" id="generateBtn" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                        Generate DLP
                    </button>
                </div>
            </div>
        </div>

        <!-- Floating Refinement UI -->
        <div id="refinePopup" class="fixed z-50 bg-white shadow-2xl rounded-xl border border-blue-200 p-4 hidden w-80 no-print">
            <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2">Refine this segment</p>
            <textarea id="refinePrompt" class="w-full text-xs p-2 border border-gray-200 rounded mb-2 outline-none focus:ring-2 ring-blue-500" rows="3" placeholder="e.g., 'Make this activity more group-oriented' or 'Simplify the language'"></textarea>
            <div class="flex justify-between items-center">
                <button onclick="hideRefine()" class="text-[10px] font-bold text-gray-400 hover:text-gray-600">CANCEL</button>
                <button id="refineBtn" onclick="applyRefinement()" class="bg-blue-600 text-white text-[10px] font-bold px-3 py-1.5 rounded hover:bg-blue-700 transition">APPLY CHANGES</button>
            </div>
        </div>

        <!-- History Section -->
        <div id="historyContainer" class="bg-white p-6 rounded-lg shadow-md no-print hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">Recent Lesson Plans</h2>
                <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">Clear All</button>
            </div>
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto pr-2">
                <!-- History items will be injected here -->
            </div>
        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="hidden bg-white p-8 rounded-lg shadow-md content-area relative">
            <div class="flex justify-between items-center mb-6 no-print">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold">Generated Lesson Plan</h2>
                    <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">PRO-TIP: Highlight text to refine it with AI</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyToClipboard()" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">Copy for Word</button>
                    <button onclick="downloadDoc()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Download .docx</button>
                    <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Print / Save PDF</button>
                </div>
            </div>

            <div id="dlpContent" class="text-sm leading-relaxed text-gray-800">
                <!-- Content will be injected here -->
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center p-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 font-medium loading-dots">AI is crafting your lesson plan</p>
        </div>

        <!-- System Log Console -->
        <div id="logContainer" class="bg-gray-900 text-green-400 p-4 rounded-lg shadow-xl font-mono text-xs mt-6 no-print overflow-hidden">
            <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
                <span class="font-bold text-gray-400">SYSTEM ACTIVITY LOG</span>
                <div class="flex gap-3">
                    <button onclick="copyLogs()" class="hover:text-white transition">COPY LOGS</button>
                    <button onclick="clearLogs()" class="hover:text-red-400 transition">CLEAR</button>
                </div>
            </div>
            <div id="logConsole" class="max-h-40 overflow-y-auto space-y-1">
                <div>[SYSTEM] Console initialized. Standing by...</div>
            </div>
        </div>
    </div>

    <script>
        let currentParsedData = null;
        let lastSelectedField = null;
        let currentHistoryId = null;
        let history = JSON.parse(localStorage.getItem('dlp_history') || '[]');

        // Constants and Field Mappings
        const FRESH_TEMPLATE_MAP = {
            table1: {
                lessonTitle: { row: 0, cell: 1 },
                subject: { row: 1, cell: 1 },
                teacherName: { row: 2, cell: 1 },
                gradeLevel: { row: 3, cell: 1 },
                sessions: { row: 4, cell: 1 },
                references: { row: 5, cell: 1 },
                aiDeclaration: { row: 6, cell: 1 },
                competency: { row: 8, cell: 1 },
                knowledge: { row: 9, cell: 1 },
                skills: { row: 10, cell: 1 },
                behavior: { row: 11, cell: 1 },
                learnerContext: { row: 12, cell: 1 },
                resources: { row: 14, cell: 1 },
                preLesson: { row: 15, cell: 1 },
                flow: { row: 16, cell: 1 },
                integration: { row: 17, cell: 1 },
                assessment: { row: 19, cell: 1 },
                extendedLearning: { row: 21, cell: 1 },
                reflection: { row: 22, cell: 1 }
            }
        };

        // Logging Utility
        function log(message, type = 'info') {
            const consoleEl = document.getElementById('logConsole');
            if (!consoleEl) return;
            const entry = document.createElement('div');
            const timestamp = new Date().toLocaleTimeString();
            let color = 'text-green-400';
            if (type === 'error') color = 'text-red-400';
            if (type === 'warn') color = 'text-yellow-400';
            if (type === 'system') color = 'text-blue-400';

            entry.className = color;
            entry.innerHTML = `<span>[${timestamp}]</span> [${type.toUpperCase()}] ${message}`;
            consoleEl.appendChild(entry);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLogs() {
            document.getElementById('logConsole').innerHTML = '<div>[SYSTEM] Logs cleared.</div>';
        }

        async function copyLogs() {
            const text = document.getElementById('logConsole').innerText;
            await navigator.clipboard.writeText(text);
            alert("Logs copied to clipboard!");
        }

        // Sync manual edits back to data object and persistence
        document.getElementById('dlpContent').addEventListener('input', function(e) {
            const field = e.target.getAttribute('data-field');
            if (field && currentParsedData && currentHistoryId) {
                const newValue = e.target.innerHTML;
                
                if (field.startsWith('day_')) {
                    const index = parseInt(field.split('_')[1]);
                    currentParsedData.days[index].content = newValue;
                } else if (field.startsWith('objectives_')) {
                    const type = field.split('_')[1];
                    currentParsedData.objectives[type] = newValue;
                } else {
                    currentParsedData[field] = newValue;
                }

                const item = history.find(h => h.id === currentHistoryId);
                if (item) {
                    item.data = currentParsedData;
                    if (field === 'subject') item.subject = e.target.innerText;
                    if (field === 'gradeLevel') item.gradeLevel = e.target.innerText;
                    if (field === 'teacherName') item.teacherName = e.target.innerText;

                    localStorage.setItem('dlp_history', JSON.stringify(history));
                    renderHistoryList();
                }
            }
        });

        function saveToHistory(data, inputs) {
            const newItem = {
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                subject: inputs.subject,
                gradeLevel: inputs.gradeLevel,
                teacherName: "Jhunrie G. Bayog",
                contentStandard: inputs.contentStandard,
                performanceStandard: inputs.performanceStandard,
                competency: inputs.competency,
                userSuggestions: inputs.userSuggestions,
                data: data
            };
            currentHistoryId = newItem.id;
            history.unshift(newItem);
            if (history.length > 15) history.pop();
            localStorage.setItem('dlp_history', JSON.stringify(history));
            localStorage.setItem('last_dlp_id', newItem.id);
            renderHistoryList();
        }

        function renderHistoryList() {
            const container = document.getElementById('historyContainer');
            const list = document.getElementById('historyList');
            if (history.length === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            list.innerHTML = history.map(item => `
                <div onclick="loadFromHistory(${item.id})" class="cursor-pointer border ${item.id === currentHistoryId ? 'border-blue-500 bg-blue-50' : 'border-gray-200'} p-3 rounded hover:bg-blue-50 transition flex justify-between items-center group">
                    <div>
                        <p class="font-bold text-sm text-blue-600">${item.subject || 'Untitled'}</p>
                        <p class="text-[10px] text-gray-500">${item.timestamp} • Grade ${item.gradeLevel}</p>
                    </div>
                    <button onclick="deleteHistoryItem(event, ${item.id})" class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            `).join('');
        }

        function loadFromHistory(id) {
            const item = history.find(h => h.id === id);
            if (!item) return;
            currentParsedData = item.data;
            currentHistoryId = id;
            document.getElementById('subject').value = item.subject;
            document.getElementById('gradeLevel').value = item.gradeLevel;
            document.getElementById('contentStandard').value = item.contentStandard || '';
            document.getElementById('performanceStandard').value = item.performanceStandard || '';
            document.getElementById('competency').value = item.competency;
            document.getElementById('userSuggestions').value = item.userSuggestions || '';
            document.getElementById('dlpContent').innerHTML = renderTemplate(currentParsedData, item.subject, item.gradeLevel, item.contentStandard || '', item.performanceStandard || '', item.competency, item.teacherName || "Jhunrie G. Bayog");
            document.getElementById('outputContainer').classList.remove('hidden');
            localStorage.setItem('last_dlp_id', id);
            renderHistoryList();
        }

        function deleteHistoryItem(e, id) {
            e.stopPropagation();
            history = history.filter(h => h.id !== id);
            localStorage.setItem('dlp_history', JSON.stringify(history));
            renderHistoryList();
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all history?')) {
                history = [];
                localStorage.setItem('dlp_history', JSON.stringify(history));
                renderHistoryList();
            }
        }

        document.addEventListener('mouseup', function(e) {
            const selection = window.getSelection();
            const text = selection.toString().trim();
            if (text && text.length > 3) {
                let target = selection.anchorNode;
                if (target.nodeType === 3) target = target.parentElement;
                const editableParent = target.closest('.field-editable');
                if (editableParent) {
                    lastSelectedField = editableParent.getAttribute('data-field');
                    const popup = document.getElementById('refinePopup');
                    const x = Math.min(e.clientX, window.innerWidth - 350);
                    const y = Math.min(e.clientY + 20, window.innerHeight - 200);
                    popup.style.left = `${x}px`;
                    popup.style.top = `${y}px`;
                    popup.classList.remove('hidden');
                }
            } else if (!e.target.closest('#refinePopup')) {
                hideRefine();
            }
        });

        function hideRefine() {
            document.getElementById('refinePopup').classList.add('hidden');
            document.getElementById('refinePrompt').value = '';
        }

        async function applyRefinement() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptText = document.getElementById('refinePrompt').value.trim();
            const btn = document.getElementById('refineBtn');
            const selectedModel = document.getElementById('modelSelect').value;
            if (!promptText || !lastSelectedField || !currentParsedData) return;
            btn.disabled = true;
            btn.innerText = "REFINING...";
            const subject = document.getElementById('subject').value;
            let context = lastSelectedField.startsWith('day_') ? currentParsedData.days[parseInt(lastSelectedField.split('_')[1])].content : currentParsedData[lastSelectedField];
            try {
                const newContent = await callRefineSegment({ apiKey, subject, promptText, context, selectedModel });
                if (newContent) {
                    if (lastSelectedField.startsWith('day_')) {
                        currentParsedData.days[parseInt(lastSelectedField.split('_')[1])].content = newContent;
                    } else {
                        currentParsedData[lastSelectedField] = newContent;
                    }
                    const item = history.find(h => h.id === currentHistoryId);
                    if (item) { item.data = currentParsedData; localStorage.setItem('dlp_history', JSON.stringify(history)); }
                    document.getElementById('dlpContent').innerHTML = renderTemplate(currentParsedData, subject, document.getElementById('gradeLevel').value, document.getElementById('contentStandard').value, document.getElementById('performanceStandard').value, document.getElementById('competency').value, item ? item.teacherName : "Jhunrie G. Bayog");
                    hideRefine();
                }
            } catch (e) { alert('Refinement Error: ' + e.message); } finally { btn.disabled = false; btn.innerText = "APPLY CHANGES"; }
        }

        async function copyToClipboard() {
            if (!currentParsedData) return;
            const content = document.getElementById('dlpContent').innerHTML;
            const blob = new Blob([`<div style="font-family: 'Bookman Old Style', serif;">${content}</div>`], { type: 'text/html' });
            const data = [new ClipboardItem({ 'text/html': blob })];
            try { await navigator.clipboard.write(data); alert("Copied!"); } catch (err) { alert("Copy failed."); }
        }

        // --- PRODUCTION DOCX EXPORT SYSTEM ---

        function cleanForPlainTextExport(value) {
            if (value === null || value === undefined) return "";
            let text = String(value);
            text = text.replace(/\\<br>/g, "\n").replace(/\\n/g, "\n");
            text = text.replace(/<br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n").replace(/<\/div>/gi, "\n").replace(/<li>/gi, "\n- ").replace(/<\/li>/gi, "").replace(/<ul>|<\/ul>|<ol>|<\/ol>/gi, "");
            text = text.replace(/<[^>]+>/g, "");
            const entities = { '&nbsp;': ' ', '&#x20;': ' ', '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'", '&#x27;': "'", '&#34;': '"', '&#60;': '<', '&#62;': '>' };
            for (let key in entities) { text = text.replace(new RegExp(key, 'g'), entities[key]); }
            text = text.replace(/&#(\d+);/g, (match, dec) => String.fromCharCode(dec)).replace(/&#x([0-9a-f]+);/gi, (match, hex) => String.fromCharCode(parseInt(hex, 16)));
            text = text.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/__([^_]+)__/g, "$1").replace(/^#+\s+/gm, "").replace(/^\|?\s*[:\-|\s]+\|?\s*$/gm, "");
            return text.replace(/\n\s*\n\s*\n+/g, "\n\n").trim();
        }

        function writePlainTextToCell(xmlDoc, cell, text, wNS) {
            if (!cell) return;
            const tcPr = cell.getElementsByTagNameNS(wNS, 'tcPr')[0];
            const firstP = cell.getElementsByTagNameNS(wNS, 'p')[0];
            let pPr = firstP ? firstP.getElementsByTagNameNS(wNS, 'pPr')[0] : null;
            let rPr = null;
            if (firstP) {
                const firstR = firstP.getElementsByTagNameNS(wNS, 'r')[0];
                if (firstR) rPr = firstR.getElementsByTagNameNS(wNS, 'rPr')[0];
            }
            Array.from(cell.childNodes).forEach(child => { if (child.localName !== 'tcPr') cell.removeChild(child); });
            text.split('\n').forEach(line => {
                const p = xmlDoc.createElementNS(wNS, 'w:p');
                if (pPr) p.appendChild(pPr.cloneNode(true));
                const r = xmlDoc.createElementNS(wNS, 'w:r');
                const currentRPr = rPr ? rPr.cloneNode(true) : xmlDoc.createElementNS(wNS, 'w:rPr');
                let rFonts = currentRPr.getElementsByTagNameNS(wNS, 'rFonts')[0];
                if (!rFonts) { rFonts = xmlDoc.createElementNS(wNS, 'w:rFonts'); currentRPr.appendChild(rFonts); }
                rFonts.setAttributeNS(wNS, 'w:ascii', 'Bookman Old Style');
                rFonts.setAttributeNS(wNS, 'w:hAnsi', 'Bookman Old Style');
                rFonts.setAttributeNS(wNS, 'w:eastAsia', 'Bookman Old Style');
                rFonts.setAttributeNS(wNS, 'w:cs', 'Bookman Old Style');
                r.appendChild(currentRPr);
                const t = xmlDoc.createElementNS(wNS, 'w:t');
                t.setAttribute('xml:space', 'preserve');
                t.textContent = line;
                r.appendChild(t);
                p.appendChild(r);
                cell.appendChild(p);
            });
        }

        function appendPlainTextToCellAfterLabel(xmlDoc, tableNode, rIdx, cIdx, label, text, wNS) {
            const row = tableNode.getElementsByTagNameNS(wNS, 'tr')[rIdx];
            if (!row) return;
            const cells = Array.from(row.childNodes).filter(n => n.nodeName === 'w:tc' || n.localName === 'tc');
            const cell = cells[cIdx];
            if (!cell) return;
            const ps = Array.from(cell.getElementsByTagNameNS(wNS, 'p'));
            let targetP = ps.find(p => p.textContent.includes(label)) || ps[ps.length - 1];
            if (!targetP) { writePlainTextToCell(xmlDoc, cell, text, wNS); return; }
            const pPr = targetP.getElementsByTagNameNS(wNS, 'pPr')[0];
            const rPr = targetP.getElementsByTagNameNS(wNS, 'rPr')[0] || (targetP.getElementsByTagNameNS(wNS, 'r')[0]?.getElementsByTagNameNS(wNS, 'rPr')[0]);
            let lastInserted = targetP;
            text.split('\n').forEach(line => {
                if (!line.trim()) return;
                const p = xmlDoc.createElementNS(wNS, 'w:p');
                if (pPr) p.appendChild(pPr.cloneNode(true));
                const r = xmlDoc.createElementNS(wNS, 'w:r');
                const currentRPr = rPr ? rPr.cloneNode(true) : xmlDoc.createElementNS(wNS, 'w:rPr');
                let rFonts = currentRPr.getElementsByTagNameNS(wNS, 'rFonts')[0];
                if (!rFonts) { rFonts = xmlDoc.createElementNS(wNS, 'w:rFonts'); currentRPr.appendChild(rFonts); }
                rFonts.setAttributeNS(wNS, 'w:ascii', 'Bookman Old Style');
                rFonts.setAttributeNS(wNS, 'w:hAnsi', 'Bookman Old Style');
                rFonts.setAttributeNS(wNS, 'w:eastAsia', 'Bookman Old Style');
                rFonts.setAttributeNS(wNS, 'w:cs', 'Bookman Old Style');
                r.appendChild(currentRPr);
                const t = xmlDoc.createElementNS(wNS, 'w:t');
                t.setAttribute('xml:space', 'preserve');
                t.textContent = line;
                r.appendChild(t);
                p.appendChild(r);
                cell.insertBefore(p, lastInserted.nextSibling);
                lastInserted = p;
            });
        }

        function getCell(table, r, c, wNS) {
            const rows = table.getElementsByTagNameNS(wNS, 'tr');
            if (!rows[r]) return null;
            const cells = Array.from(rows[r].childNodes).filter(n => n.nodeName === 'w:tc' || n.localName === 'tc');
            return cells[c];
        }

        async function downloadDoc() {
            if (!currentParsedData) { alert("Please generate a lesson plan first."); return; }
            log("Starting production DOCX export...", "system");
            try {
                const response = await fetch('./assets/fresh-template.docx');
                if (!response.ok) throw new Error("Template file not found.");
                const buffer = await response.arrayBuffer();
                const zip = new PizZip(buffer);
                const docPath = 'word/document.xml';
                const xmlString = zip.file(docPath).asText();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, "application/xml");
                const wNS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
                const tables = xmlDoc.getElementsByTagNameNS(wNS, 'tbl');
                const table1 = tables[0];
                const fields = FRESH_TEMPLATE_MAP.table1;

                const getClean = (val) => cleanForPlainTextExport(val);
                const inputs = { subject: document.getElementById('subject').value, gradeLevel: document.getElementById('gradeLevel').value, competency: document.getElementById('competency').value };

                const dataToExport = {
                    lessonTitle: getClean(currentParsedData.subject || inputs.subject),
                    subject: getClean(currentParsedData.subject || inputs.subject),
                    teacherName: getClean(currentParsedData.teacherName || "Jhunrie G. Bayog"),
                    gradeLevel: getClean(currentParsedData.gradeLevel || inputs.gradeLevel),
                    sessions: String(currentParsedData.days?.length || 0),
                    references: getClean(currentParsedData.references),
                    aiDeclaration: getClean(currentParsedData.ai_declaration),
                    competency: getClean(inputs.competency),
                    knowledge: getClean(currentParsedData.objectives?.knowledge),
                    skills: getClean(currentParsedData.objectives?.skills),
                    behavior: getClean(currentParsedData.objectives?.behavior),
                    learner_context: getClean(currentParsedData.learner_context),
                    pre_lesson: getClean(currentParsedData.pre_lesson),
                    integration: getClean(currentParsedData.integration),
                    assessment: getClean(currentParsedData.assessment),
                    home_task: getClean(currentParsedData.home_task),
                    reflection: getClean(currentParsedData.reflection),
                };

                let flowText = "";
                currentParsedData.days.forEach((day, i) => { flowText += `DAY ${i + 1}: ${day.title}\n${day.content}\n\n`; });
                flowText += `Let's Reflect On It! (Magnilay Tayo!)\n${currentParsedData.wrap_up || ""}`;
                dataToExport.flow = getClean(flowText);

                // Populate fields
                writePlainTextToCell(xmlDoc, getCell(table1, fields.lessonTitle.row, fields.lessonTitle.cell, wNS), dataToExport.lessonTitle, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.subject.row, fields.subject.cell, wNS), dataToExport.subject, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.teacherName.row, fields.teacherName.cell, wNS), dataToExport.teacherName, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.gradeLevel.row, fields.gradeLevel.cell, wNS), dataToExport.gradeLevel, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.sessions.row, fields.sessions.cell, wNS), dataToExport.sessions, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.references.row, fields.references.cell, wNS), dataToExport.references, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.aiDeclaration.row, fields.aiDeclaration.cell, wNS), dataToExport.aiDeclaration, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.competency.row, fields.competency.cell, wNS), dataToExport.competency, wNS);
                
                appendPlainTextToCellAfterLabel(xmlDoc, table1, fields.knowledge.row, fields.knowledge.cell, "Knowledge:", dataToExport.knowledge, wNS);
                appendPlainTextToCellAfterLabel(xmlDoc, table1, fields.skills.row, fields.skills.cell, "Skills:", dataToExport.skills, wNS);
                appendPlainTextToCellAfterLabel(xmlDoc, table1, fields.behavior.row, fields.behavior.cell, "Behavior:", dataToExport.behavior, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.learnerContext.row, fields.learnerContext.cell, wNS), dataToExport.learner_context, wNS);

                let resourcesHayo = "", resourcesHinay = "";
                if (currentParsedData.resources?.includes("HINAY:")) {
                    const rParts = currentParsedData.resources.split(/HINAY:/i);
                    resourcesHayo = getClean(rParts[0].replace(/HAYO:/i, ""));
                    resourcesHinay = getClean(rParts[1]);
                } else { resourcesHayo = getClean(currentParsedData.resources); }
                appendPlainTextToCellAfterLabel(xmlDoc, table1, fields.resources.row, fields.resources.cell, "HAYO:", resourcesHayo, wNS);
                appendPlainTextToCellAfterLabel(xmlDoc, table1, fields.resources.row, fields.resources.cell, "HINAY:", resourcesHinay, wNS);

                writePlainTextToCell(xmlDoc, getCell(table1, fields.preLesson.row, fields.preLesson.cell, wNS), dataToExport.pre_lesson, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.flow.row, fields.flow.cell, wNS), dataToExport.flow, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.integration.row, fields.integration.cell, wNS), dataToExport.integration, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.assessment.row, fields.assessment.cell, wNS), dataToExport.assessment, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.extendedLearning.row, fields.extendedLearning.cell, wNS), dataToExport.home_task, wNS);
                writePlainTextToCell(xmlDoc, getCell(table1, fields.reflection.row, fields.reflection.cell, wNS), dataToExport.reflection, wNS);

                const serializer = new XMLSerializer();
                zip.file(docPath, serializer.serializeToString(xmlDoc));
                const out = zip.generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
                saveAs(out, `LessonPlan_${dataToExport.subject.replace(/\s+/g, '_')}.docx`);
                
                log("[PRODUCTION DOCX EXPORT] SUCCESS", "system");
            } catch (e) { log("Export Error: " + e.message, "error"); alert("Export failed: " + e.message); }
        }

                    el.addEventListener('input', (e) => localStorage.setItem(field, e.target.value));

        async function generateDLP() {
            log("Requesting new lesson plan from AI...", "system");
            const inputs = {
                apiKey: document.getElementById('apiKey').value.trim(),
                subject: document.getElementById('subject').value.trim(),
                gradeLevel: document.getElementById('gradeLevel').value.trim(),
                numDays: document.getElementById('numDays').value,
                contentStandard: document.getElementById('contentStandard').value.trim(),
                performanceStandard: document.getElementById('performanceStandard').value.trim(),
                competency: document.getElementById('competency').value.trim(),
                userSuggestions: document.getElementById('userSuggestions').value.trim(),
                selectedModel: document.getElementById('modelSelect').value
            };
            if (!inputs.apiKey) { alert('Please enter an API Key'); return; }
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const output = document.getElementById('outputContainer');
            btn.disabled = true;
            loading.classList.remove('hidden');
            output.classList.add('hidden');
            try {
                const result = await callGenerateDLP(inputs);
                log("AI response received.", "info");
                currentParsedData = JSON.parse(result.text.replace(/^```json\n?|```$/gm, '').trim());
                saveToHistory(currentParsedData, inputs);
                document.getElementById('dlpContent').innerHTML = renderTemplate(currentParsedData, inputs.subject, inputs.gradeLevel, inputs.contentStandard, inputs.performanceStandard, inputs.competency);
                output.classList.remove('hidden');
            } catch (error) { log(`API Error: ${error.message}`, "error"); alert('API Error: ' + error.message); } finally { btn.disabled = false; loading.classList.add('hidden'); }
        }
