<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DLP Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .content-area { box-shadow: none; border: none; width: 100%; max-width: 100%; margin: 0; }
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        /* Style for the generated DLP table to match the screenshots */
        .dlp-table th { background-color: #f3f4f6; text-align: left; padding: 12px; border: 1px solid #d1d5db; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; tracking: 0.05em; }
        .dlp-table td { padding: 12px; border: 1px solid #d1d5db; vertical-align: top; }
        .section-header { background-color: #374151; color: white; padding: 8px 12px; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Input Section -->
        <div class="bg-white p-6 rounded-lg shadow-md no-print">
            <h1 class="text-2xl font-bold mb-4 text-blue-600">AI Detailed Lesson Plan Maker</h1>

            <div class="grid grid-cols-1 gap-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="apiKey" class="block text-sm font-medium text-gray-700">Gemini API Key</label>
                        <input type="password" id="apiKey" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your API Key">
                    </div>
                    <div>
                        <label for="modelSelect" class="block text-sm font-medium text-gray-700">AI Model</label>
                        <select id="modelSelect" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="gemini-3.1-flash-lite" selected>Gemini 3.1 Flash-Lite (Speed/Lite)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deep Detail)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                        <input type="text" id="subject" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., Introduction to Philosophy">
                    </div>
                    <div>
                        <label for="gradeLevel" class="block text-sm font-medium text-gray-700">Grade Level</label>
                        <input type="text" id="gradeLevel" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., 12">
                    </div>
                </div>

                <div>
                    <label for="contentStandard" class="block text-sm font-medium text-gray-700">Content Standard</label>
                    <textarea id="contentStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="performanceStandard" class="block text-sm font-medium text-gray-700">Performance Standard</label>
                    <textarea id="performanceStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="competency" class="block text-sm font-medium text-gray-700">Learning Competencies (with codes)</label>
                    <textarea id="competency" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="Paste one or more competencies here...&#10;e.g.,&#10;1. PPT11/12-Ib-1.2...&#10;2. PPT11/12-Ic-2.1..."></textarea>
                </div>

                <button onclick="generateDLP()" id="generateBtn" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                    Generate DLP
                </button>
            </div>
        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="hidden bg-white p-8 rounded-lg shadow-md content-area">
            <div class="flex justify-between items-center mb-6 no-print">
                <h2 class="text-xl font-bold">Generated Lesson Plan</h2>
                <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Print / Save PDF</button>
            </div>

            <div id="dlpContent" class="text-sm leading-relaxed text-gray-800">
                <!-- Content will be injected here -->
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center p-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 font-medium loading-dots">AI is crafting your lesson plan</p>
        </div>
    </div>

    <script>
        // Load saved values on startup
        window.onload = function() {
            const fields = ['apiKey', 'subject', 'gradeLevel', 'contentStandard', 'performanceStandard', 'competency', 'modelSelect'];
            fields.forEach(field => {
                const savedValue = localStorage.getItem(field);
                if (savedValue) {
                    document.getElementById(field).value = savedValue;
                }
                
                // Add event listener to save on change
                const el = document.getElementById(field);
                if (el) {
                    el.addEventListener('input', (e) => {
                        localStorage.setItem(field, e.target.value);
                    });
                    // For select elements
                    el.addEventListener('change', (e) => {
                        localStorage.setItem(field, e.target.value);
                    });
                }
            });
        };

        function renderTemplate(data, subject, gradeLevel, contentStandard, performanceStandard, competency) {
            const formattedCompetency = competency.split('\n').map(c => `<li>${c.trim()}</li>`).join('');
            
            return `
                <div class="border-2 border-gray-800 p-8 bg-white shadow-lg max-w-[210mm] mx-auto text-[11pt] leading-tight font-serif text-black">
                    <!-- Header -->
                    <div class="flex justify-between items-start border-b-2 border-gray-800 pb-4 mb-4 font-sans">
                        <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-[8px] text-center border border-gray-400">LOGO 1</div>
                        <div class="text-center flex-1 mx-4">
                            <p class="font-bold text-sm">SCHOOLS DIVISION OF ALBAY</p>
                            <p class="font-black text-base uppercase">San Antonio National High School</p>
                            <p class="text-[10px] mt-1 italic uppercase font-bold tracking-widest text-blue-800">Department of Education - Region V</p>
                        </div>
                        <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-[8px] text-center border border-gray-400">LOGO 2</div>
                    </div>

                    <table class="w-full border-collapse border border-gray-800 mb-6 font-sans">
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold w-1/3 border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Subject</td>
                            <td class="p-2 w-2/3 uppercase font-bold text-xs">${subject}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Grade Level</td>
                            <td class="p-2 text-xs">${gradeLevel}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Content Standard</td>
                            <td class="p-2 italic text-xs font-serif">${contentStandard}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Performance Standard</td>
                            <td class="p-2 italic text-xs font-serif">${performanceStandard}</td>
                        </tr>
                    </table>

                    <!-- I. INTENTIONS -->
                    <div class="section-header font-sans">I. INTENTIONS</div>
                    <table class="w-full border-collapse border border-gray-800 mb-6">
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px] font-sans">i. Learning Competencies</td>
                            <td class="p-3 w-2/3 text-xs"><ul class="list-disc ml-4 space-y-1">${formattedCompetency}</ul></td>
                        </tr>
                        <tr>
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans">ii. Learning Objectives</td>
                            <td class="p-3 text-xs text-justify">${data.objectives}</td>
                        </tr>
                    </table>

                    <!-- L. LEARNING EXPERIENCE -->
                    <div class="section-header font-sans">L. LEARNING EXPERIENCE</div>
                    <table class="w-full border-collapse border border-gray-800 mb-6">
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px] font-sans">i. Learning resources</td>
                            <td class="p-3 w-2/3 text-xs">${data.resources}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans">ii. Pre-lesson activity</td>
                            <td class="p-3 text-xs text-justify">${data.pre_lesson}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans flex flex-col justify-between min-h-[450px]">
                                <div>iii. Lesson flow</div>
                                <div class="mt-8">
                                    <p class="font-bold text-[10px] mb-2 uppercase border-b border-gray-200 pb-1">Flow Principles</p>
                                    <ul class="list-disc ml-4 space-y-2 text-[9px] italic font-normal leading-tight text-gray-600">
                                        <li>Make the objectives clear for all learners</li>
                                        <li>Guide learners before letting them try the task on their own</li>
                                        <li>Check the state of the learners' well-being, understanding, and mastery over the lesson</li>
                                        <li>Connect today's new concept to past competencies</li>
                                        <li>Encourage collaboration among learners</li>
                                        <li>Invite learners to reflect on why these matter to them</li>
                                        <li>Ensure inclusion for learners' varied abilities, learning styles, and contexts</li>
                                    </ul>
                                </div>
                            </td>
                            <td class="p-3 text-xs">
                                <div class="space-y-5">
                                    <div><p class="font-bold underline text-[11px] mb-1 uppercase tracking-tight font-sans">DAY 1: ${data.day1_title}</p><div class="text-justify">${data.day1_content}</div></div>
                                    <div><p class="font-bold underline text-[11px] mb-1 uppercase tracking-tight font-sans">DAY 2: ${data.day2_title}</p><div class="text-justify">${data.day2_content}</div></div>
                                    <div><p class="font-bold underline text-[11px] mb-1 uppercase tracking-tight font-sans">DAY 3: ${data.day3_title}</p><div class="text-justify">${data.day3_content}</div></div>
                                    <div><p class="font-bold underline text-[11px] mb-1 uppercase tracking-tight font-sans">DAY 4: ${data.day4_title}</p><div class="text-justify">${data.day4_content}</div></div>
                                    <div class="mt-6 p-4 bg-gray-50 border border-dashed border-gray-400 rounded">
                                        <p class="font-bold text-[10px] uppercase tracking-wider mb-2 font-sans">Let's Reflect On It!</p>
                                        <p class="italic text-[12px] leading-relaxed text-blue-900 font-serif">${data.wrap_up}</p>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans">iv. Opportunities for integration</td>
                            <td class="p-3 text-xs text-justify">${data.integration}</td>
                        </tr>
                    </table>

                    <!-- A. ASSESSING LEARNING -->
                    <div class="section-header font-sans">A. ASSESSING LEARNING</div>
                    <table class="w-full border-collapse border border-gray-800 mb-6">
                        <tr>
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px] font-sans">i. Formative assessments</td>
                            <td class="p-3 w-2/3 text-xs text-justify">${data.assessment}</td>
                        </tr>
                    </table>

                    <!-- W. WAYS FORWARD -->
                    <div class="section-header font-sans">W. WAYS FORWARD</div>
                    <table class="w-full border-collapse border border-gray-800 font-sans">
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px]">i. Reflective practice</td>
                            <td class="p-3 w-2/3 text-xs text-justify font-serif">${data.reflection}</td>
                        </tr>
                        <tr>
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px]">ii. Extended learning opportunities</td>
                            <td class="p-3 text-xs text-justify font-serif">${data.home_task}</td>
                        </tr>
                    </table>
                </div>
            `;
        }

        async function generateDLP() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const gradeLevel = document.getElementById('gradeLevel').value.trim();
            const contentStandard = document.getElementById('contentStandard').value.trim();
            const performanceStandard = document.getElementById('performanceStandard').value.trim();
            const competency = document.getElementById('competency').value.trim();

            if (!apiKey) {
                alert('Please enter an API Key');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const output = document.getElementById('outputContainer');

            btn.disabled = true;
            loading.classList.remove('hidden');
            output.classList.add('hidden');

            const prompt = `
                Act as a DepEd Master Teacher. Fill in the specific content for a 4-day Lesson Plan based on:
                Subject: ${subject}
                Competency: ${competency}

                RETURN A JSON OBJECT ONLY. NO MARKDOWN.
                Structure:
                {
                    "objectives": "Detailed KSA objectives using HTML <ul><li>...</li></ul> formatting",
                    "resources": "Formatting: <b>A. HAYO (High Activity):</b> [Detailed content]<br><br><b>B. HINAY (Remedial):</b> [Detailed content]",
                    "pre_lesson": "Name of game, directions, and scoring mechanism...",
                    "day1_title": "Unique thematic name", "day1_content": "Descriptive process...",
                    "day2_title": "Unique thematic name", "day2_content": "Major task/directions...",
                    "day3_title": "Unique thematic name", "day3_content": "Intervention/Tool used...",
                    "day4_title": "Unique thematic name", "day4_content": "Peer collaboration...",
                    "wrap_up": "Fill-in-the-blank reflection prompt (e.g., 'I used to think... but now...')",
                    "integration": "Links to other subjects...",
                    "assessment": "Specific look-fors and methods using HTML bullet points where applicable",
                    "reflection": "Questions for the teacher...",
                    "home_task": "Specific extension task..."
                }

                Ensure content is WORDY and PROFESSIONAL. Avoid generic phrases. Focus on student agency and clarity. Use HTML tags (<ul>, <li>, <b>, <p>, <br>) INSIDE the JSON strings to provide clean formatting."
            `;

            const selectedModel = document.getElementById('modelSelect').value;
            
            // Build model list with preference first
            const modelsToTry = [];
            if (selectedModel === 'gemini-1.5-pro') {
                modelsToTry.push({ name: 'gemini-1.5-pro', version: 'v1beta' });
                modelsToTry.push({ name: 'gemini-1.5-pro', version: 'v1' });
                modelsToTry.push({ name: 'gemini-3.1-flash-lite', version: 'v1beta' });
            } else {
                modelsToTry.push({ name: 'gemini-3.1-flash-lite', version: 'v1beta' });
                modelsToTry.push({ name: 'gemini-1.5-flash', version: 'v1' });
                modelsToTry.push({ name: 'gemini-1.5-pro', version: 'v1beta' });
            }
            
            let lastError = '';

            for (const model of modelsToTry) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/${model.version}/models/${model.name}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        let aiResponse = data.candidates[0].content.parts[0].text;
                        // Clean JSON if AI added markdown backticks
                        const cleanJsonStr = aiResponse.replace(/^```json\n?|```$/gm, '').trim();
                        const parsedData = JSON.parse(cleanJsonStr);
                        
                        document.getElementById('dlpContent').innerHTML = renderTemplate(
                            parsedData, subject, gradeLevel, contentStandard, performanceStandard, competency
                        );
                        
                        output.classList.remove('hidden');
                        lastError = '';
                        break;
                    } else {
                        lastError = data.error ? data.error.message : 'Unknown Error';
                        continue;
                    }
                } catch (error) {
                    lastError = error.message;
                    continue;
                }
            }

            if (lastError) {
                alert('API Error: ' + lastError);
            }

            btn.disabled = false;
            loading.classList.add('hidden');
        }
    </script>
</body>
</html>
