<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DLP Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .content-area { box-shadow: none; border: none; width: 100%; max-width: 100%; margin: 0; }
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        /* Style for the generated DLP table to match the screenshots */
        .dlp-table th { background-color: #f3f4f6; text-align: left; padding: 12px; border: 1px solid #d1d5db; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; tracking: 0.05em; }
        .dlp-table td { padding: 12px; border: 1px solid #d1d5db; vertical-align: top; }
        .section-header { background-color: #374151; color: white; padding: 8px 12px; font-weight: bold; text-transform: uppercase; margin-top: 20px; }
        
        /* Editable area indicator */
        .field-editable:hover { background-color: #f0f7ff; cursor: text; transition: background 0.2s; }
        .field-editable::selection { background-color: #bfdbfe; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Input Section -->
        <div class="bg-white p-6 rounded-lg shadow-md no-print">
            <h1 class="text-2xl font-bold mb-4 text-blue-600">AI Detailed Lesson Plan Maker</h1>

            <div class="grid grid-cols-1 gap-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="apiKey" class="block text-sm font-medium text-gray-700">Gemini API Key</label>
                        <input type="password" id="apiKey" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your API Key">
                    </div>
                    <div>
                        <label for="modelSelect" class="block text-sm font-medium text-gray-700">AI Model</label>
                        <select id="modelSelect" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="gemini-3.1-flash-lite" selected>Gemini 3.1 Flash-Lite (Speed/Lite)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deep Detail)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                        <input type="text" id="subject" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., Introduction to Philosophy">
                    </div>
                    <div>
                        <label for="gradeLevel" class="block text-sm font-medium text-gray-700">Grade Level</label>
                        <input type="text" id="gradeLevel" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="e.g., 12">
                    </div>
                    <div>
                        <label for="numDays" class="block text-sm font-medium text-gray-700">Number of Days</label>
                        <select id="numDays" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="1">1 Day</option>
                            <option value="2">2 Days</option>
                            <option value="3">3 Days</option>
                            <option value="4" selected>4 Days</option>
                            <option value="5">5 Days</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="contentStandard" class="block text-sm font-medium text-gray-700">Content Standard</label>
                    <textarea id="contentStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="performanceStandard" class="block text-sm font-medium text-gray-700">Performance Standard</label>
                    <textarea id="performanceStandard" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm"></textarea>
                </div>

                <div>
                    <label for="competency" class="block text-sm font-medium text-gray-700">Learning Competencies (with codes)</label>
                    <textarea id="competency" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm" placeholder="Paste one or more competencies here...&#10;e.g.,&#10;1. PPT11/12-Ib-1.2...&#10;2. PPT11/12-Ic-2.1..."></textarea>
                </div>

                <button onclick="generateDLP()" id="generateBtn" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                    Generate DLP
                </button>
            </div>
        </div>

        <!-- Floating Refinement UI -->
        <div id="refinePopup" class="fixed z-50 bg-white shadow-2xl rounded-xl border border-blue-200 p-4 hidden w-80 no-print">
            <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2">Refine this segment</p>
            <textarea id="refinePrompt" class="w-full text-xs p-2 border border-gray-200 rounded mb-2 outline-none focus:ring-2 ring-blue-500" rows="3" placeholder="e.g., 'Make this activity more group-oriented' or 'Simplify the language'"></textarea>
            <div class="flex justify-between items-center">
                <button onclick="hideRefine()" class="text-[10px] font-bold text-gray-400 hover:text-gray-600">CANCEL</button>
                <button id="refineBtn" onclick="applyRefinement()" class="bg-blue-600 text-white text-[10px] font-bold px-3 py-1.5 rounded hover:bg-blue-700 transition">APPLY CHANGES</button>
            </div>
        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="hidden bg-white p-8 rounded-lg shadow-md content-area relative">
            <div class="flex justify-between items-center mb-6 no-print">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold">Generated Lesson Plan</h2>
                    <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">PRO-TIP: Highlight text to refine it with AI</span>
                </div>
                <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Print / Save PDF</button>
            </div>

            <div id="dlpContent" class="text-sm leading-relaxed text-gray-800">
                <!-- Content will be injected here -->
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center p-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 font-medium loading-dots">AI is crafting your lesson plan</p>
        </div>
    </div>

    <script>
        let currentParsedData = null;
        let lastSelectedField = null;

        // Selection Listener for Refinement
        document.addEventListener('mouseup', function(e) {
            const selection = window.getSelection();
            const text = selection.toString().trim();
            
            if (text && text.length > 3) {
                // Find if the selection is inside a field-editable element
                let target = selection.anchorNode;
                if (target.nodeType === 3) target = target.parentElement;
                
                const editableParent = target.closest('.field-editable');

                if (editableParent) {
                    lastSelectedField = editableParent.getAttribute('data-field');
                    const popup = document.getElementById('refinePopup');
                    
                    // Position popup near the mouse cursor using clientX/Y (viewport relative)
                    // since the popup is "fixed"
                    const x = Math.min(e.clientX, window.innerWidth - 350);
                    const y = Math.min(e.clientY + 20, window.innerHeight - 200);
                    
                    popup.style.left = `${x}px`;
                    popup.style.top = `${y}px`;
                    popup.classList.remove('hidden');
                }
            } else {
                if (!e.target.closest('#refinePopup')) {
                    hideRefine();
                }
            }
        });

        function hideRefine() {
            document.getElementById('refinePopup').classList.add('hidden');
            document.getElementById('refinePrompt').value = '';
        }

        async function applyRefinement() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptText = document.getElementById('refinePrompt').value.trim();
            const btn = document.getElementById('refineBtn');
            
            if (!promptText) return;
            if (!lastSelectedField || !currentParsedData) return;

            btn.disabled = true;
            btn.innerText = "REFINING...";

            const subject = document.getElementById('subject').value;
            let context = '';
            if (lastSelectedField.startsWith('day_')) {
                const index = parseInt(lastSelectedField.split('_')[1]);
                context = currentParsedData.days[index].content;
            } else {
                context = currentParsedData[lastSelectedField];
            }

            const refinePrompt = `
                Act as a DepEd Master Teacher crafting a student-centered instructional guide.
                I have this specific segment from a lesson plan in ${subject}:
                "${context}"

                User Request: "${promptText}"

                TONE RULE: Avoid administrative jargon. Speak as if you are directly guiding the teacher on how to talk to and engage the students. The language should be professional, immersive, and sophisticated.

                LANGUAGE RULE: Maintain the same language (Filipino or English) as the current segment text provided above.

                Please rewrite this segment to fulfill the request. RETURN ONLY THE UPDATED TEXT.
                USE HTML TAGS (<ul>, <li>, <b>, <p>, <br>) IF NECESSARY.
                NO MARKDOWN. NO JSON. JUST THE UPDATED CONTENT.
            `;

            try {
                const model = document.getElementById('modelSelect').value === 'gemini-1.5-pro' 
                    ? { name: 'gemini-1.5-pro', version: 'v1beta' }
                    : { name: 'gemini-3.1-flash-lite', version: 'v1beta' };

                const response = await fetch(`https://generativelanguage.googleapis.com/${model.version}/models/${model.name}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: refinePrompt }] }]
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    const newContent = data.candidates[0].content.parts[0].text.replace(/^```html\n?|```$/gm, '').trim();
                    
                    if (lastSelectedField.startsWith('day_')) {
                        const index = parseInt(lastSelectedField.split('_')[1]);
                        currentParsedData.days[index].content = newContent;
                    } else {
                        currentParsedData[lastSelectedField] = newContent;
                    }
                    
                    // Re-render
                    const subject = document.getElementById('subject').value.trim();
                    const gradeLevel = document.getElementById('gradeLevel').value.trim();
                    const contentStandard = document.getElementById('contentStandard').value.trim();
                    const performanceStandard = document.getElementById('performanceStandard').value.trim();
                    const competency = document.getElementById('competency').value.trim();

                    document.getElementById('dlpContent').innerHTML = renderTemplate(
                        currentParsedData, subject, gradeLevel, contentStandard, performanceStandard, competency
                    );
                    hideRefine();
                } else {
                    alert('Error refining: ' + (data.error ? data.error.message : 'Unknown error'));
                }
            } catch (e) {
                alert('Connection error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "APPLY CHANGES";
            }
        }

        // Load saved values on startup
        window.onload = function() {
            const fields = ['apiKey', 'subject', 'gradeLevel', 'contentStandard', 'performanceStandard', 'competency', 'modelSelect', 'numDays'];
            fields.forEach(field => {
                const savedValue = localStorage.getItem(field);
                if (savedValue) {
                    const el = document.getElementById(field);
                    if (el) el.value = savedValue;
                }
                
                const el = document.getElementById(field);
                if (el) {
                    el.addEventListener('input', (e) => localStorage.setItem(field, e.target.value));
                    el.addEventListener('change', (e) => localStorage.setItem(field, e.target.value));
                }
            });
        };

        function renderTemplate(data, subject, gradeLevel, contentStandard, performanceStandard, competency) {
            const formattedCompetency = competency.split('\n').map(c => `<li>${c.trim()}</li>`).join('');
            
            let daysHtml = '';
            data.days.forEach((day, index) => {
                daysHtml += `
                    <div>
                        <p class="font-bold underline text-[11px] mb-1 uppercase tracking-tight font-sans">DAY ${index + 1}: ${day.title}</p>
                        <div class="text-justify field-editable" data-field="day_${index}">${day.content}</div>
                    </div>
                `;
            });

            return `
                <div class="border-2 border-gray-800 p-8 bg-white shadow-lg max-w-[210mm] mx-auto text-[11pt] leading-tight font-serif text-black">
                    <!-- Header -->
                    <div class="flex justify-between items-start border-b-2 border-gray-800 pb-4 mb-4 font-sans">
                        <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-[8px] text-center border border-gray-400">LOGO 1</div>
                        <div class="text-center flex-1 mx-4">
                            <p class="font-bold text-sm">SCHOOLS DIVISION OF ALBAY</p>
                            <p class="font-black text-base uppercase">San Antonio National High School</p>
                            <p class="text-[10px] mt-1 italic uppercase font-bold tracking-widest text-blue-800">Department of Education - Region V</p>
                        </div>
                        <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-[8px] text-center border border-gray-400">LOGO 2</div>
                    </div>

                    <table class="w-full border-collapse border border-gray-800 mb-6 font-sans">
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold w-1/3 border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Subject (Asignatura)</td>
                            <td class="p-2 w-2/3 uppercase font-bold text-xs">${subject}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Grade Level (Antas)</td>
                            <td class="p-2 text-xs">${gradeLevel}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Content Standard (Pamantayang Pangnilalaman)</td>
                            <td class="p-2 italic text-xs font-serif">${contentStandard}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-2 font-bold border-r border-gray-800 bg-gray-50 uppercase text-[10px]">Performance Standard (Pamantayan sa Pagganap)</td>
                            <td class="p-2 italic text-xs font-serif">${performanceStandard}</td>
                        </tr>
                    </table>

                    <!-- I. INTENTIONS -->
                    <div class="section-header font-sans">I. INTENTIONS (INTENSYON)</div>
                    <table class="w-full border-collapse border border-gray-800 mb-6">
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px] font-sans">i. Learning Competencies (Mga Kasanayang Pampagkatuto)</td>
                            <td class="p-3 w-2/3 text-xs"><ul class="list-disc ml-4 space-y-1">${formattedCompetency}</ul></td>
                        </tr>
                        <tr>
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans">ii. Learning Objectives (Mga Layunin sa Pagkatuto)</td>
                            <td class="p-3 text-xs text-justify field-editable" data-field="objectives">${data.objectives}</td>
                        </tr>
                    </table>

                    <!-- L. LEARNING EXPERIENCE -->
                    <div class="section-header font-sans">L. LEARNING EXPERIENCE (KARANASAN SA PAGKATUTO)</div>
                    <table class="w-full border-collapse border border-gray-800 mb-6">
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px] font-sans">i. Learning resources (Mga Kagamitan sa Pagkatuto)</td>
                            <td class="p-3 w-2/3 text-xs field-editable" data-field="resources">${data.resources}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans">ii. Pre-lesson activity (Gawain Bago ang Aralin)</td>
                            <td class="p-3 text-xs text-justify field-editable" data-field="pre_lesson">${data.pre_lesson}</td>
                        </tr>
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans flex flex-col justify-between min-h-[450px]">
                                <div>iii. Lesson flow (Daloy ng Aralin)</div>
                                <div class="mt-8">
                                    <p class="font-bold text-[10px] mb-2 uppercase border-b border-gray-200 pb-1">Flow Principles (Mga Prinsipyo ng Daloy)</p>
                                    <ul class="list-disc ml-4 space-y-2 text-[9px] italic font-normal leading-tight text-gray-600">
                                        <li>Make the objectives clear for all learners</li>
                                        <li>Guide learners before letting them try the task on their own</li>
                                        <li>Check the state of the learners' well-being, understanding, and mastery over the lesson</li>
                                        <li>Connect today's new concept to past competencies</li>
                                        <li>Encourage collaboration among learners</li>
                                        <li>Invite learners to reflect on why these matter to them</li>
                                        <li>Ensure inclusion for learners' varied abilities, learning styles, and contexts</li>
                                    </ul>
                                </div>
                            </td>
                            <td class="p-3 text-xs">
                                <div class="space-y-5">
                                    ${daysHtml}
                                    <div class="mt-6 p-4 bg-gray-50 border border-dashed border-gray-400 rounded">
                                        <p class="font-bold text-[10px] uppercase tracking-wider mb-2 font-sans">Let's Reflect On It! (Magnilay Tayo!)</p>
                                        <p class="italic text-[12px] leading-relaxed text-blue-900 font-serif field-editable" data-field="wrap_up">${data.wrap_up}</p>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px] font-sans">iv. Opportunities for integration (Mga Oportunidad para sa Integrasyon)</td>
                            <td class="p-3 text-xs text-justify field-editable" data-field="integration">${data.integration}</td>
                        </tr>
                    </table>

                    <!-- A. ASSESSING LEARNING -->
                    <div class="section-header font-sans">A. ASSESSING LEARNING (PAGTATAYA SA PAGKATUTO)</div>
                    <table class="w-full border-collapse border border-gray-800 mb-6">
                        <tr>
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px] font-sans">i. Formative assessments (Mga Pormatibong Pagtataya)</td>
                            <td class="p-3 w-2/3 text-xs text-justify field-editable" data-field="assessment">${data.assessment}</td>
                        </tr>
                    </table>

                    <!-- W. WAYS FORWARD -->
                    <div class="section-header font-sans">W. WAYS FORWARD (MGA HAKBANG PASULONG)</div>
                    <table class="w-full border-collapse border border-gray-800 font-sans">
                        <tr class="border-b border-gray-800">
                            <td class="p-3 font-bold w-1/3 border-r border-gray-800 bg-gray-50 text-[11px]">i. Reflective practice (Replektibong Pagsasanay)</td>
                            <td class="p-3 w-2/3 text-xs text-justify font-serif field-editable" data-field="reflection">${data.reflection}</td>
                        </tr>
                        <tr>
                            <td class="p-3 font-bold border-r border-gray-800 bg-gray-50 text-[11px]">ii. Extended learning opportunities (Mga Karagdagang Oportunidad sa Pagkatuto)</td>
                            <td class="p-3 text-xs text-justify font-serif field-editable" data-field="home_task">${data.home_task}</td>
                        </tr>
                    </table>
                </div>
            `;
        }

        async function generateDLP() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const gradeLevel = document.getElementById('gradeLevel').value.trim();
            const numDays = document.getElementById('numDays').value;
            const contentStandard = document.getElementById('contentStandard').value.trim();
            const performanceStandard = document.getElementById('performanceStandard').value.trim();
            const competency = document.getElementById('competency').value.trim();

            if (!apiKey) {
                alert('Please enter an API Key');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const output = document.getElementById('outputContainer');

            btn.disabled = true;
            loading.classList.remove('hidden');
            output.classList.add('hidden');

            const prompt = `
                Act as a DepEd Master Teacher crafting a student-centered, immersive instructional guide.
                Generate a ${numDays}-day Lesson Plan based on:
                Subject: ${subject}
                Competency: ${competency}
                Content Standard: ${contentStandard}
                Performance Standard: ${performanceStandard}

                CORE INSTRUCTION: 
                - Sound like a Facilitator's Script (directly addressing students or describing professional interaction).
                - Ensure coherence: The ${numDays} days must form a logical "Instructional Arc".
                - VARIETY IS KEY: Do NOT repeat the same routine every day. Use diverse strategies (Socratic Seminars, Gamified Challenges, Gallery Walks, Case Studies, etc.).

                DAILY FLOW PRINCIPLES (Be creative and thematic with segment headers):
                - For each session, create unique and appropriate headers for each segment of the flow (e.g., instead of "The Bridge", it could be "Pagtawid sa Bagong Kaalaman" or "Connecting the Dots").
                - The headers should reflect the specific activity or pedagogical goal of that segment.
                - Ensure the flow generally moves from an engaging start, through deep immersion/interaction, to a meaningful check for understanding and assessment.
                - Use HTML <b> tags for these headers.

                LANGUAGE RULE: Detect the language of the input. Use Filipino if the input is Filipino; otherwise, use English. IF FILIPINO, ENSURE ALL LABELS (like "The Bridge") ARE ALSO TRANSLATED TO FILIPINO.

                RETURN A JSON OBJECT ONLY. NO MARKDOWN.
                Structure:
                {
                    "objectives": "Detailed KSA objectives using HTML <ul><li>...</li></ul>",
                    "resources": "<b>A. HAYO:</b> [Materials]<br><b>B. HINAY:</b> [Scaffolding]",
                    "pre_lesson": "Overall unit hook script.",
                    "days": [
                        {
                            "title": "Creative/Thematic Title",
                            "content": "A wordy, sophisticated script of the session flow. Use your creative headers for each segment (e.g., <b>[Creative Header]:</b> [Content])."
                        }
                        // Generate exactly ${numDays} days
                    ],
                    "wrap_up": "Closing thought script.",
                    "integration": "Cross-disciplinary links.",
                    "assessment": "Summary of indicators.",
                    "reflection": "Teacher self-check.",
                    "home_task": "Extension task."
                }

                Ensure content is WORDY, SMART, and CLEANly typed. Use HTML tags (<ul>, <li>, <b>, <p>, <br>) inside JSON strings."
            `;

            const selectedModel = document.getElementById('modelSelect').value;
            
            // Build model list with preference first
            const modelsToTry = [];
            if (selectedModel === 'gemini-1.5-pro') {
                modelsToTry.push({ name: 'gemini-1.5-pro', version: 'v1beta' });
                modelsToTry.push({ name: 'gemini-1.5-pro', version: 'v1' });
                modelsToTry.push({ name: 'gemini-3.1-flash-lite', version: 'v1beta' });
            } else {
                modelsToTry.push({ name: 'gemini-3.1-flash-lite', version: 'v1beta' });
                modelsToTry.push({ name: 'gemini-1.5-flash', version: 'v1' });
                modelsToTry.push({ name: 'gemini-1.5-pro', version: 'v1beta' });
            }
            
            let lastError = '';

            for (const model of modelsToTry) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/${model.version}/models/${model.name}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        let aiResponse = data.candidates[0].content.parts[0].text;
                        // Clean JSON if AI added markdown backticks
                        const cleanJsonStr = aiResponse.replace(/^```json\n?|```$/gm, '').trim();
                        currentParsedData = JSON.parse(cleanJsonStr);
                        
                        document.getElementById('dlpContent').innerHTML = renderTemplate(
                            currentParsedData, subject, gradeLevel, contentStandard, performanceStandard, competency
                        );
                        
                        output.classList.remove('hidden');
                        lastError = '';
                        break;
                    } else {
                        lastError = data.error ? data.error.message : 'Unknown Error';
                        continue;
                    }
                } catch (error) {
                    lastError = error.message;
                    continue;
                }
            }

            if (lastError) {
                alert('API Error: ' + lastError);
            }

            btn.disabled = false;
            loading.classList.add('hidden');
        }
    </script>
</body>
</html>
